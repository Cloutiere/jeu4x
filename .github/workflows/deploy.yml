# CI/CD — Phase 5 L4 (DESIGN.md §5, HANDOFF-PHASE5.md)
#
# Déploiement du Worker COMPLET sur push vers main : le frontend est servi par
# le Worker même (Static Assets, apps/web/dist) — pas de Cloudflare Pages.
#
# Prérequis (côté Erik, documentés dans apps/server/README.md § CI/CD) :
#  1. repo GitHub + push de cette branche main ;
#  2. secret GitHub CLOUDFLARE_API_TOKEN (template « Edit Cloudflare Workers »).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # L'ID de compte n'est pas un secret ; explicite car wrangler est non
      # interactif en CI et le token est scoppé à un seul compte.
      CLOUDFLARE_ACCOUNT_ID: 02dd3eea63bdb31596a0d89636b2ea34
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version lue depuis "packageManager" dans package.json (source unique).

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web (assets du Worker)
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # S'ignore tant que le secret CLOUDFLARE_API_TOKEN n'est pas posé —
      # les push restent verts (tests + typecheck seuls).
      - name: Deploy (wrangler --env prod)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm --filter @game/server exec wrangler deploy --env prod
