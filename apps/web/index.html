<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4X multijoueur asynchrone</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // TEMPORAIRE (debug labo 3D) : capture des erreurs de démarrage.
      window.__errs = [];
      window.addEventListener('error', (e) => { window.__errs.push('ERR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno); });
      window.addEventListener('unhandledrejection', (e) => { window.__errs.push('REJ: ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason).slice(0, 500)); });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
